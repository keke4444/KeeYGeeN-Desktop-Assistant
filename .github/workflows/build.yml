name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build exe
        shell: pwsh
        run: |
          & "$env:USERPROFILE\go\bin\wails.exe" build -platform windows/amd64 -webview2 download

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\KeeYGeeN桌面助手.iss"

      - name: Rename artifacts to ASCII
        shell: pwsh
        run: |
          Copy-Item "build\bin\KeeYGeeN桌面助手.exe" "build\bin\KeeYGeeN-Windows.exe" -Force
          Copy-Item "dist\KeeYGeeN桌面助手-Setup.exe" "dist\KeeYGeeN-Setup.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/bin/KeeYGeeN-Windows.exe
            dist/KeeYGeeN-Setup.exe

  macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build app
        run: wails build -platform darwin/universal

      - name: Zip app bundle
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent *.app "KeeYGeeN-macOS-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/bin/*.zip

  release:
    name: Publish Release
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-x64
          path: artifacts/windows-x64

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-universal
          path: artifacts/macos-universal

      - name: List artifacts
        run: find artifacts -type f -maxdepth 3 -print

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/windows-x64/**/*.exe
            artifacts/macos-universal/*.zip
